<!DOCTYPE html>
<html>
<head>
    <title>KnowledgeHub AI</title>
</head>

<body>

    <h1>KnowledgeHub AI</h1>

    {% if message %}
    <div
        style="
            padding:15px;
            margin-bottom:20px;
            border-radius:8px;
            color:white;
            background-color:{% if status == 'success' %}#16a34a{% else %}#dc2626{% endif %};
        "
    >
        {{ message }}
    </div>
    {% endif %}

    <form action="/upload" method="post" enctype="multipart/form-data">

        <input type="file" name="file" required>

        <button type="submit">
            Upload
        </button>

    </form>

    <hr>

    <h2>Uploaded Documents</h2>

    <ul>
        {% for file in files %}
            <li>{{ file.name }}</li>
        {% endfor %}
    </ul>

</body>
</html>
